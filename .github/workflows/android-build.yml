name: Build Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: retro3do-play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replacement emulator
        uses: actions/checkout@v4
        with:
          # Validate this repository's Gradle wrapper before checking out SDL.
          # SDL carries example-project wrappers that are never executed here
          # and are not part of Gradle's published checksum catalogue.
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize native submodules
        run: git submodule update --init --recursive

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Apply Retro-3DO SDL Vulkan fixes
        run: git -C third_party/SDL apply ../../patches/sdl-vulkan-android.patch

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub secret: ${secret_name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/retro3do-upload.keystore
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build signed replacement AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/retro3do-upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-3do-signed-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove plaintext keystore
        if: always()
        run: rm -f "${{ runner.temp }}/retro3do-upload.keystore"
