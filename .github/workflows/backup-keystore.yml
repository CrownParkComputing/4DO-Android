name: Backup keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 BACKUP_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done

      - name: Decode, validate and encrypt
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          size=$(stat -c%s "$keystore")
          if [ "$size" -lt 256 ]; then
            echo "::error::Decoded keystore is only ${size} bytes"
            exit 1
          fi
          magic=$(head -c 4 "$keystore" | xxd -p)
          case "$magic" in
            feedfeed) echo "Validated JKS (${size} bytes)" ;;
            504b0304) echo "Validated PKCS#12 (${size} bytes)" ;;
            *) echo "::error::Not a recognised keystore"; exit 1 ;;
          esac
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$keystore" \
            -out "${RUNNER_TEMP}/release.keystore.enc" \
            -pass env:BACKUP_PASSPHRASE
          shred -u "$keystore" 2>/dev/null || rm -f "$keystore"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: retro3do-keystore-backup-encrypted
          path: ${{ runner.temp }}/release.keystore.enc
          retention-days: 1
          if-no-files-found: error
