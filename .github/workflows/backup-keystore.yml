# Recover the release keystore from Actions secrets, encrypted.
#
# The signing key exists in exactly one place - the KEYSTORE_BASE64 secret - and
# a secret cannot be read back through the UI or the API. That makes the key a
# single point of failure on a published app: if this repository is deleted or
# the secret is overwritten, the listing can never be updated again.
#
# This workflow is the only supported way to get it back out.
#
# THIS REPOSITORY IS PUBLIC. Anyone who can see the repo can download its build
# artifacts, so the keystore is encrypted with a passphrase before it is
# uploaded and is useless to anyone without it. Never change this workflow to
# upload the raw .keystore.
#
# Before running, set one more secret:
#
#   BACKUP_PASSPHRASE   a long random passphrase, stored somewhere other than
#                       GitHub - a password manager, not this repository
#
# Then: Actions -> Backup keystore -> Run workflow. Download the artifact and
# decrypt it locally with
#
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
#       -in release.keystore.enc -out ~/.keys/retro3do-upload.jks
#
# Verify it afterwards, because a backup that has never been restored is not a
# backup:
#
#   keytool -list -keystore ~/.keys/retro3do-upload.jks
#
# The SHA-256 fingerprint it prints must match the upload certificate shown in
# Play Console under Setup -> App signing.
name: Backup keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 BACKUP_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode and encrypt
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          # Decode into the runner's temp dir, never the workspace, so it cannot
          # be picked up by anything that archives the checkout.
          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          # A truncated or empty secret decodes without error and produces a
          # useless backup, so confirm this is really a keystore before trusting
          # it. Both formats Java uses start with a known magic number.
          size=$(stat -c%s "$keystore")
          if [ "$size" -lt 256 ]; then
            echo "::error::Decoded keystore is only ${size} bytes - the secret looks truncated"
            exit 1
          fi
          magic=$(head -c 4 "$keystore" | xxd -p)
          case "$magic" in
            feedfeed) echo "Format: JKS (${size} bytes)" ;;      # JKS
            504b0304) echo "Format: PKCS#12 (${size} bytes)" ;;  # PKCS#12 is a zip
            *) echo "::error::Not a keystore - magic bytes were ${magic}"; exit 1 ;;
          esac

          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$keystore" \
            -out "${RUNNER_TEMP}/release.keystore.enc" \
            -pass env:BACKUP_PASSPHRASE

          # The plaintext must not outlive this step.
          shred -u "$keystore" 2>/dev/null || rm -f "$keystore"

          echo "Encrypted backup is $(stat -c%s "${RUNNER_TEMP}/release.keystore.enc") bytes"

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: ${{ runner.temp }}/release.keystore.enc
          # Short retention: this exists to be downloaded once and stored
          # properly, not to sit on a public repository.
          retention-days: 1
          if-no-files-found: error
