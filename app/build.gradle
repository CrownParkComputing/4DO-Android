apply plugin: 'com.android.application'

def localReleaseKeystore = file('../4do-release-key.keystore')
def releaseKeystorePath = System.getenv('KEYSTORE_PATH')
def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : localReleaseKeystore

android {
    namespace "com.fourdo.android"
    compileSdk 36

    defaultConfig {
        applicationId "com.fourdo.android"
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName "2.0.11"

        buildConfigField "String", "IGDB_CLIENT_ID", "\"r1xsns8dbmeb0xxualwaotref8o9ti\""
        buildConfigField "String", "IGDB_CLIENT_SECRET", "\"d30omhdyjuebh9h8c6jvg5cntz75n7\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile.exists() ? releaseKeystoreFile : null
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: '4do-key'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            // R8 code shrinking/obfuscation. Produces mapping.txt (the Play
            // "deobfuscation file") and reduces app size. Resource shrinking is
            // left off since some assets are resolved indirectly.
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    // 7zip extraction support
    implementation 'org.apache.commons:commons-compress:1.25.0'
    implementation 'org.tukaani:xz:1.9'
}
